name: Crear ejecutable Windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: python -m pip install pyinstaller==6.22.0
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name OrganizadorDescargas app.py
      - uses: actions/upload-artifact@v4
        with:
          name: OrganizadorDescargas-Windows
          path: dist/OrganizadorDescargas.exe
